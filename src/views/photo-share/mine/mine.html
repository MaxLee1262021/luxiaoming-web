<div class="photo-share">
  <header class="photo-heading"><div><p class="photo-eyebrow">摄影师分成管理 · 摄影端</p><h2>我的分成</h2><p>{{ photoMineAll ? '全部摄影师的报酬与对账单，选择摄影师可查看个人分成。' : (photoState.mine.photo.name || '摄影师本人') + ' · ' + (photoCanPreviewMine ? '当前摄影师的个人分成视图。' : '仅展示当前登录账号所绑定摄影师的报酬与对账单。') }}</p></div><el-button v-if="photoCanReadMine" :loading="photoState.exporting" @click="exportPhotoLedger(true)">{{ photoMineAll ? '导出全部明细' : '导出明细' }}</el-button></header>
  <el-alert v-if="!photoCanReadMine" title="请使用已绑定摄影师档案的本人账号查看" type="info" :closable="false" />
  <template v-else><div v-if="photoCanPreviewMine" class="photo-mine-preview"><strong>摄影师视角预览</strong><el-select v-model="photoState.mineQuery.photo" clearable filterable placeholder="全部摄影师" aria-label="选择预览摄影师" @change="loadPhotoMine(true)"><el-option value="" label="全部摄影师" /><el-option v-for="photographer in photoState.mine.photographers" :key="photographer.id" :value="photographer.id" :label="photographer.name + ' · ' + photographer.id" /></el-select><span>{{ photoMineAll ? '当前汇总全部摄影师数据' : '当前查看所选摄影师的数据' }}</span></div><div class="photo-filters"><el-date-picker v-model="photoState.mineQuery.period" type="month" value-format="YYYY-MM" placeholder="完成月份" :clearable="false" @change="loadPhotoMine(true)" /></div><div v-if="photoState.errors.mine" class="photo-error" role="alert">{{ photoState.errors.mine }}</div>
    <div class="photo-metrics five"><div><span>本月报酬</span><strong>{{ photoMoney(photoState.mine.kpi.month_fen) }}</strong><small>按订单完成月归集</small></div><div><span>累计报酬</span><strong>{{ photoMoney(photoState.mine.kpi.total_fen) }}</strong><small>包含已结算记录</small></div><div><span>本月订单</span><strong>{{ photoState.mine.kpi.month_orders ?? '—' }}</strong><small>笔</small></div><div v-if="photoMineAll"><span>摄影师人数</span><strong>{{ photoState.mine.photographers.length }}</strong><small>含暂停与终止档案</small></div><div v-else><span>当前四类比例</span><strong class="photo-small-rates">照 {{ photoPercent(photoRateValue(photoState.mine.kpi.rates,'photo')) }} · 视 {{ photoPercent(photoRateValue(photoState.mine.kpi.rates,'video')) }}<br>套 {{ photoPercent(photoRateValue(photoState.mine.kpi.rates,'combo')) }} · 周 {{ photoPercent(photoRateValue(photoState.mine.kpi.rates,'peripheral')) }}</strong><small>历史订单保留原比例</small></div><div><span>已结算明细</span><strong>{{ photoState.mine.kpi.settled_rows ?? '—' }}</strong><small>行</small></div></div>
    <section class="photo-panel"><h3>{{ photoMineAll ? '全部摄影师报酬明细' : '我的报酬明细' }}</h3><el-table class="photo-table" :data="photoState.mine.rows" v-loading="photoState.loading.mine" empty-text="本月暂无报酬明细"><el-table-column v-if="photoCanPreviewMine" prop="photo_name" label="摄影师" min-width="130" /><el-table-column prop="biz_no" label="订单号" min-width="155" /><el-table-column label="客户 OpenID" width="120"><template #default="{row}"><span class="photo-mono" :title="row.customer_openid">{{ row.customer_openid ? row.customer_openid.slice(0,6) + '…' + row.customer_openid.slice(-4) : '—' }}</span></template></el-table-column><el-table-column label="类目" width="65"><template #default="{row}">{{ photoLabel(row.category) }}</template></el-table-column><el-table-column label="商品" min-width="175"><template #default="{row}"><div>{{ row.product_name || '—' }}</div><div class="photo-muted">{{ row.merchant_name || '—' }} · {{ String(row.done_at || row.paid_at || '').slice(0,10) }}</div></template></el-table-column><el-table-column label="净额" width="90" align="right"><template #default="{row}">{{ photoMoney(row.net_amount_fen) }}</template></el-table-column><el-table-column label="计算依据" width="168"><template #default="{row}"><span class="photo-nowrap photo-mono">{{ photoMoney(row.net_amount_fen) }}×{{ photoLabel(row.category) }}单{{ photoPercent(row.rate_bp) }}</span></template></el-table-column><el-table-column label="比例" width="75" align="right"><template #default="{row}">{{ photoPercent(row.rate_bp) }}</template></el-table-column><el-table-column label="报酬" width="105" align="right"><template #default="{row}"><strong :class="{'photo-zero':row.status === 'void'}">{{ photoMoney(row.commission_fen) }}</strong><div v-if="row.zero_reason" class="photo-muted">{{ photoLabel(row.zero_reason) }}</div><div v-else-if="Number(row.rate_bp) === 0" class="photo-muted">比例已设为0</div></template></el-table-column><el-table-column label="状态" width="85"><template #default="{row}"><el-tag :type="photoTag(row.status)" size="small">{{ photoLabel(row.status) }}</el-tag><div v-if="row.adjustment_pending" class="photo-muted" :title="row.adjustment_reason">{{ Number(row.makeup_pending_fen) > 0 ? '待补发 ' + photoMoney(row.makeup_pending_fen) : '待冲抵' }}</div></template></el-table-column></el-table><div v-if="photoState.mine.total" class="photo-pager"><el-pagination background layout="total, prev, pager, next" :total="photoState.mine.total" v-model:current-page="photoState.mineQuery.page" :page-size="photoState.mineQuery.size" @current-change="loadPhotoMine()" /></div></section>
    <section class="photo-panel"><h3>{{ photoMineAll ? '全部摄影师月度对账单' : '我的月度对账单' }}</h3><el-table class="photo-table" :data="photoState.mine.settlements" :empty-text="photoCanPreviewMine ? '本月暂无对账单' : '本月尚未推送对账单'"><el-table-column v-if="photoCanPreviewMine" prop="photo_name" label="摄影师" min-width="130" /><el-table-column prop="settle_id" label="对账单号" min-width="210" /><el-table-column prop="period" label="期间" width="110" /><el-table-column label="应发金额" width="135" align="right"><template #default="{row}">{{ photoMoney(row.payable_fen) }}<div v-if="Number(row.offset_fen) !== 0" class="photo-muted">{{ Number(row.offset_fen) < 0 ? '净补发 ' + photoMoney(-Number(row.offset_fen)) : '本期冲抵 ' + photoMoney(row.offset_fen) }}</div></template></el-table-column><el-table-column label="状态" min-width="160"><template #default="{row}">{{ photoLabel(row.status) }}<div class="photo-muted">{{ row.acceptance_note || row.accept_note || row.note || '' }}</div></template></el-table-column><el-table-column label="异议截止日" min-width="130"><template #default="{row}">{{ row.dispute_until ? String(row.dispute_until).slice(0,10) : '—' }}</template></el-table-column></el-table><p class="photo-muted">本期异议通过线下渠道受理；如需核对事实，请在异议截止日前联系运营。工作日不含周末，逾期未提异议将自动视为认可。</p></section>
  </template>
</div>
