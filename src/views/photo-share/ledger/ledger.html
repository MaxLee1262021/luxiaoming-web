<div class="photo-share">
  <header class="photo-heading"><div><p class="photo-eyebrow">摄影师分成 · PH-02</p><h2>分成明细</h2><p>按完成月归集，无观察期。转派保留原人零元记录，比例与金额均以入账快照为准。</p></div><el-button :loading="photoState.exporting" :disabled="!photoCanView" @click="exportPhotoLedger(false)">导出明细 CSV</el-button></header>
  <el-alert v-if="!photoCanView" title="当前账号没有摄影师分成查看权限" type="warning" :closable="false" />
  <template v-else>
    <div class="photo-metrics"><div><span>本月报酬合计</span><strong>{{ photoMoney(photoState.ledgerSummary.amount_fen ?? photoState.ledgerSummary.total_fen) }}</strong><small>当前筛选范围</small></div><div><span>明细行数</span><strong>{{ photoState.ledgerTotal }}</strong><small>含已置零记录</small></div><div><span>已结算</span><strong>{{ photoState.ledgerSummary.settled_rows ?? '—' }}</strong><small>已加入结算单</small></div><div><span>已置零</span><strong>{{ photoState.ledgerSummary.void_rows ?? '—' }}</strong><small>原金额与原因可追溯</small></div></div>
    <section class="photo-panel"><form class="photo-filters" @submit.prevent="loadPhotoLedger(true)"><el-date-picker v-model="photoState.ledgerQuery.period" type="month" value-format="YYYY-MM" placeholder="完成月份" clearable @change="loadPhotoLedger(true)" /><el-select v-model="photoState.ledgerQuery.photo" clearable filterable placeholder="全部摄影师" @change="loadPhotoLedger(true)"><el-option v-for="person in photoState.options" :key="person.id" :value="person.id" :label="person.name" /></el-select><el-select v-model="photoState.ledgerQuery.type" clearable placeholder="全部类目" @change="loadPhotoLedger(true)"><el-option v-for="category in photoCategories" :key="category.key" :value="category.key" :label="category.label" /></el-select><el-select v-model="photoState.ledgerQuery.status" clearable placeholder="全部状态" @change="loadPhotoLedger(true)"><el-option v-for="status in ['est','settleable','settled','void']" :key="status" :value="status" :label="photoLabel(status)" /></el-select><el-input v-model="photoState.ledgerQuery.keyword" clearable placeholder="订单号 / OpenID / 商品" /><el-button native-type="submit" type="primary">查询</el-button><el-button :loading="photoState.loading.ledger" @click="loadPhotoLedger()">刷新</el-button></form>
      <div v-if="photoState.errors.ledger || photoState.errors.options" class="photo-error" role="alert">{{ photoState.errors.ledger || photoState.errors.options }}</div>
      <div v-if="photoState.selected.length" class="photo-batch"><strong>已选 {{ photoState.selected.length }} 行</strong><span>报酬合计 {{ photoMoney(photoSelectedAmount) }}</span><el-button v-if="photoCanSettle" type="primary" :loading="photoState.busy" @click="batchPhotoSettle">加入草稿对账单</el-button></div>
      <el-table class="photo-table" :data="photoState.ledger" row-key="id" v-loading="photoState.loading.ledger" empty-text="暂无分成明细" @selection-change="photoState.selected = $event">
        <el-table-column type="selection" width="30" :selectable="photoSelectable" :reserve-selection="false" :disabled="!photoCanSettle" />
        <el-table-column label="订单号" width="134"><template #default="{row}"><el-button link type="primary" class="photo-mono" @click="openPhotoLedger(row)">{{ row.biz_no }}</el-button></template></el-table-column>
        <el-table-column label="客户 OpenID" width="104"><template #default="{row}"><span class="photo-oid photo-mono" :title="row.customer_openid" @click="copyPhotoOpenid(row.customer_openid)">{{ row.customer_openid ? row.customer_openid.slice(0,6) + '…' + row.customer_openid.slice(-4) : '—' }}</span></template></el-table-column>
        <el-table-column label="摄影师" width="70"><template #default="{row}"><strong>{{ row.photo_name || row.party_id }}</strong><div v-if="row.zero_reason === 'transfer'" class="photo-muted">已转派</div></template></el-table-column>
        <el-table-column label="类目" width="48"><template #default="{row}"><el-tag size="small" effect="plain">{{ photoLabel(row.category) }}</el-tag></template></el-table-column>
        <el-table-column label="商品" min-width="166"><template #default="{row}"><div>{{ row.product_name || '—' }}</div><div class="photo-muted">{{ row.merchant_name || '—' }} · {{ String(row.done_at || row.paid_at || '').slice(0,10) }}</div></template></el-table-column>
        <el-table-column label="净额" width="74" align="right"><template #default="{row}"><span class="photo-money">{{ photoMoney(row.net_amount_fen) }}</span></template></el-table-column>
        <el-table-column label="计算依据" width="148"><template #default="{row}"><span class="photo-nowrap photo-mono">{{ photoMoney(row.net_amount_fen) }}×{{ photoLabel(row.category) }}单{{ photoPercent(row.rate_bp) }}</span></template></el-table-column>
        <el-table-column label="比例" width="56" align="right"><template #default="{row}">{{ photoPercent(row.rate_bp) }}</template></el-table-column>
        <el-table-column label="报酬" width="88" align="right"><template #default="{row}"><template v-if="row.status === 'void'"><div class="photo-zero-original">{{ photoMoney(row.original_commission_fen ?? Math.floor(Number(row.net_amount_fen) * Number(row.rate_bp) / 10000)) }}</div><div class="photo-zero">¥0.00</div><div class="photo-muted">{{ photoLabel(row.zero_reason) }}</div></template><template v-else><strong class="photo-money">{{ photoMoney(row.commission_fen) }}</strong><div v-if="Number(row.rate_bp) === 0" class="photo-muted">比例已设为0</div></template></template></el-table-column>
        <el-table-column label="状态" width="76"><template #default="{row}"><el-tag :type="photoTag(row.status)" size="small">{{ photoLabel(row.status) }}</el-tag><div v-if="row.adjustment_pending" class="photo-muted" :title="row.adjustment_reason">{{ Number(row.makeup_pending_fen) > 0 ? '待补发 ' + photoMoney(row.makeup_pending_fen) : '待冲抵' }}</div></template></el-table-column>
      </el-table>
      <div class="photo-pager"><el-pagination background layout="total, sizes, prev, pager, next" :total="photoState.ledgerTotal" v-model:current-page="photoState.ledgerQuery.page" v-model:page-size="photoState.ledgerQuery.size" :page-sizes="[20,50,100]" @current-change="loadPhotoLedger()" @size-change="loadPhotoLedger(true)" /></div>
    </section>
  </template>
  <el-drawer v-model="photoState.ledgerOpen" title="订单报酬拆解" size="560px" class="photo-drawer"><template v-if="photoState.detail"><dl class="photo-kv"><dt>订单号</dt><dd>{{ photoState.detail.biz_no }}</dd><dt>客户OpenID</dt><dd class="photo-mono">{{ photoState.detail.customer_openid || '—' }}</dd><dt>摄影师</dt><dd>{{ photoState.detail.photo_name || photoState.detail.party_id }}</dd><dt>商品</dt><dd>{{ photoState.detail.product_name || '—' }}</dd><dt>类目</dt><dd>{{ photoLabel(photoState.detail.category) }}</dd><dt>订单净额</dt><dd>{{ photoMoney(photoState.detail.net_amount_fen) }}</dd><dt>取值比例</dt><dd>{{ photoPercent(photoState.detail.rate_bp) }} · {{ photoState.detail.rate_mode === 'custom' ? '单独设置' : '统一比例' }} · v{{ photoState.detail.rule_ver }}</dd><dt>支付时间</dt><dd>{{ photoTime(photoState.detail.paid_at) }}</dd><dt>完成时间</dt><dd>{{ photoTime(photoState.detail.done_at) }}</dd><dt>报酬</dt><dd><strong>{{ photoMoney(photoState.detail.commission_fen) }}</strong></dd><dt>结算单</dt><dd>{{ photoState.detail.settle_id || '尚未入单' }}</dd><dt>状态</dt><dd>{{ photoLabel(photoState.detail.status) }}</dd><dt v-if="photoState.detail.adjustment_pending">后续调账</dt><dd v-if="photoState.detail.adjustment_pending">{{ photoState.detail.adjustment_reason }}<span v-if="Number(photoState.detail.makeup_pending_fen) > 0"> · {{ photoMoney(photoState.detail.makeup_pending_fen) }}</span></dd></dl><el-alert v-if="photoState.detail.zero_reason" :title="'置零原因：' + photoLabel(photoState.detail.zero_reason)" type="warning" :closable="false" /><el-alert title="报酬按支付时点的四类比例独立计算，无观察期；已推送单据发生判责变化时，调账在下期处理。" type="info" :closable="false" /></template></el-drawer>
</div>
