<div class="photo-share">
  <header class="photo-heading"><div><p class="photo-eyebrow">摄影师分成 · PH-03</p><h2>结算管理</h2><p>按人、按完成月出单。推送后金额锁定，异议截止后自动认可，线下转账后登记凭证。</p></div><el-button v-if="photoCanSettle" type="primary" :loading="photoState.busy" @click="generatePhotoSettlements">生成当月草稿</el-button></header>
  <el-alert v-if="!photoCanView" title="当前账号没有摄影师结算查看权限" type="warning" :closable="false" />
  <section v-else class="photo-panel"><form class="photo-filters" @submit.prevent="loadPhotoSettlements(true)"><el-date-picker v-model="photoState.settlementQuery.period" type="month" value-format="YYYY-MM" placeholder="完成月份" :clearable="false" @change="loadPhotoSettlements(true)" /><el-select v-model="photoState.settlementQuery.photo" clearable filterable placeholder="全部摄影师" @change="loadPhotoSettlements(true)"><el-option v-for="person in photoState.options" :key="person.id" :value="person.id" :label="person.name" /></el-select><el-select v-model="photoState.settlementQuery.status" clearable placeholder="全部状态" @change="loadPhotoSettlements(true)"><el-option v-for="status in ['draft','pushed','accepted','paid']" :key="status" :value="status" :label="photoLabel(status)" /></el-select><el-button native-type="submit" type="primary">查询</el-button><el-button :loading="photoState.loading.settlement" @click="loadPhotoSettlements()">刷新</el-button></form>
    <div v-if="photoState.errors.settlement || photoState.errors.options" class="photo-error" role="alert">{{ photoState.errors.settlement || photoState.errors.options }}</div>
    <el-table class="photo-table" :data="photoState.settlements" v-loading="photoState.loading.settlement" empty-text="本月暂无对账单，可生成草稿">
      <el-table-column label="对账单号 / 期间" min-width="210"><template #default="{row}"><strong class="photo-mono">{{ row.settle_id }}</strong><div class="photo-muted">{{ row.period }}</div></template></el-table-column><el-table-column label="摄影师" width="100"><template #default="{row}">{{ row.photo_name || row.photo_id }}</template></el-table-column><el-table-column prop="item_count" label="笔数" width="65" align="right" /><el-table-column label="报酬合计" width="125" align="right"><template #default="{row}">{{ photoMoney(row.amount_fen) }}</template></el-table-column><el-table-column :label="photoState.settlements.some(row => Number(row.offset_fen) < 0) ? '本期冲抵 / 净补发' : '本期冲抵'" width="110" align="right"><template #default="{row}">{{ Number(row.offset_fen) < 0 ? '净补发 ' + photoMoney(-Number(row.offset_fen)) : photoMoney(row.offset_fen) }}</template></el-table-column><el-table-column label="应发金额" width="125" align="right"><template #default="{row}"><strong>{{ photoMoney(row.payable_fen) }}</strong></template></el-table-column><el-table-column label="状态" width="115"><template #default="{row}"><el-tag :type="photoTag(row.status)">{{ photoLabel(row.status) }}</el-tag><div v-if="row.acceptance_note || row.accept_note || row.note" class="photo-muted">{{ row.acceptance_note || row.accept_note || row.note }}</div></template></el-table-column><el-table-column label="异议截止日" width="130"><template #default="{row}">{{ row.dispute_until ? String(row.dispute_until).slice(0,10) : '—' }}</template></el-table-column><el-table-column label="发放时间" width="155"><template #default="{row}">{{ photoTime(row.paid_at) }}</template></el-table-column><el-table-column label="操作" min-width="180"><template #default="{row}"><el-button v-if="photoCanSettle && row.status === 'draft'" link type="primary" :disabled="photoState.busy" @click="pushPhotoSettlement(row)">推送对账</el-button><el-button v-if="photoCanSettle && row.status === 'accepted'" link type="primary" @click="openPhotoPay(row)">登记发放</el-button><a v-if="row.status === 'paid' && row.voucher_url" :href="row.voucher_url" target="_blank" rel="noopener noreferrer">查看凭证</a><span v-if="row.status === 'pushed'" class="photo-muted">异议期内</span></template></el-table-column>
    </el-table><div class="photo-pager"><el-pagination background layout="total, prev, pager, next" :total="photoState.settlementTotal" v-model:current-page="photoState.settlementQuery.page" :page-size="photoState.settlementQuery.size" @current-change="loadPhotoSettlements()" /></div>
    <p class="photo-muted">异议期默认5个工作日，从推送次日起算并跳过周末。已推送对账单发生置零，扣回将在下期调账；已发放冲抵最多结转3期。改判撤销已执行扣回时，下期以净补发列示，已推送账单保持不变。</p>
  </section>
  <el-dialog v-model="photoState.payOpen" title="登记线下发放" width="520px" class="photo-dialog" :close-on-click-modal="false" :show-close="!photoState.busy"><template v-if="photoState.payStatement"><dl class="photo-kv"><dt>对账单</dt><dd>{{ photoState.payStatement.settle_id }}</dd><dt>摄影师</dt><dd>{{ photoState.payStatement.photo_name || photoState.payStatement.photo_id }}</dd><dt>应发金额</dt><dd><strong>{{ photoMoney(photoState.payStatement.payable_fen) }}</strong></dd></dl><el-form label-position="top"><el-form-item label="转账凭证地址" required><el-input v-model="photoState.voucherUrl" placeholder="已上传凭证的HTTPS地址" maxlength="255" /></el-form-item></el-form><p class="photo-muted">请完成线下转账后登记。此操作记录已发放金额、凭证和时间。</p><div v-if="photoState.payError || photoState.errors.pay" class="photo-error" role="alert">{{ photoState.payError || photoState.errors.pay }}</div></template><template #footer><el-button :disabled="photoState.busy" @click="photoState.payOpen = false">取消</el-button><el-button type="primary" :loading="photoState.busy" @click="payPhotoSettlement">确认已发放</el-button></template></el-dialog>
</div>
