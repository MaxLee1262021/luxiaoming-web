<div class="package-table-page">
  <div class="package-table-head">
    <div>
      <span class="package-table-eyebrow">内容商品</span>
      <h3>旅拍套餐</h3>
      <p>维护小程序展示的名称、封面、价格、说明、服务内容、适用点位和主推状态。</p>
    </div>
    <div class="package-table-actions">
      <el-button plain :loading="loading" @click="refreshPackages">刷新</el-button>
      <el-button type="primary" v-if="canEdit()" @click="openCreate">新增套餐</el-button>
    </div>
  </div>

  <div class="package-table-summary" aria-label="套餐概览">
    <span><b>{{ summary.total }}</b> 个套餐</span>
    <span><b>{{ summary.visible }}</b> 个小程序可见</span>
    <span><b>{{ summary.mainPush }}</b> 个首页主推</span>
  </div>

  <div class="package-table-filters">
    <el-input v-model="keyword" clearable placeholder="搜索套餐名称、说明或服务内容" />
    <el-select v-model="spotFilter" clearable filterable placeholder="全部打卡点">
      <el-option v-for="spot in (data.spots || []).filter(Boolean)" :key="spot.id || spot._id" :label="spot.name" :value="spot.id || spot._id" />
    </el-select>
    <el-select v-model="visibilityFilter" clearable placeholder="全部状态">
      <el-option label="小程序可见" value="visible" />
      <el-option label="已下架" value="hidden" />
    </el-select>
    <el-button plain @click="resetFilters">重置</el-button>
  </div>

  <div class="package-table-wrap" v-loading="loading" element-loading-text="正在刷新套餐…">
    <el-table :data="tableRows" row-key="id" empty-text="暂无旅拍套餐，点击“新增套餐”开始维护。">
      <el-table-column label="套餐" min-width="250">
        <template #default="{ row }">
          <div class="package-cell-title">
            <img v-if="row.cover" :src="row.cover" alt="" />
            <span v-else class="package-cover-placeholder">套</span>
            <div>
              <strong>{{ row.name || '未命名套餐' }}</strong>
              <p>{{ row.description || '未填写套餐说明' }}</p>
            </div>
          </div>
        </template>
      </el-table-column>
      <el-table-column label="适用打卡点" min-width="150">
        <template #default="{ row }"><span class="table-muted">{{ packageSpotNames(row) }}</span></template>
      </el-table-column>
      <el-table-column label="套餐内容" min-width="180">
        <template #default="{ row }">
          <div class="package-tag-list">
            <el-tag v-for="tag in row.serviceTags.slice(0, 3)" :key="tag" size="small" effect="plain">{{ tag }}</el-tag>
            <span v-if="!row.serviceTags.length" class="table-muted">未填写</span>
          </div>
        </template>
      </el-table-column>
      <el-table-column label="照片留影" min-width="130">
        <template #default="{ row }"><span class="table-muted">{{ packageAlbumName(row) }}</span></template>
      </el-table-column>
      <el-table-column label="售价" width="128" align="right">
        <template #default="{ row }">
          <div class="package-price"><b>{{ priceText(row).price }}</b><del v-if="priceText(row).original">{{ priceText(row).original }}</del></div>
        </template>
      </el-table-column>
      <el-table-column label="小程序展示" width="116" align="center">
        <template #default="{ row }"><el-tag :type="statusText(row) === '已上架' ? 'success' : 'info'" effect="light">{{ statusText(row) }}</el-tag></template>
      </el-table-column>
      <el-table-column label="首页主推" width="100" align="center">
        <template #default="{ row }"><el-tag v-if="row.isMainPush" type="warning" effect="light">主推</el-tag><span v-else class="table-muted">-</span></template>
      </el-table-column>
      <el-table-column label="操作" width="228" fixed="right" align="right">
        <template #default="{ row }">
          <div class="package-table-row-actions">
            <el-button link type="primary" v-if="canEdit()" @click="openEdit(row)">编辑</el-button>
            <el-button link :type="statusText(row) === '已上架' ? 'warning' : 'success'" v-if="canEdit()" @click="toggleVisible(row)">{{ statusText(row) === '已上架' ? '下架' : '上架' }}</el-button>
            <el-button link :type="row.isMainPush ? 'info' : 'warning'" v-if="canEdit()" @click="toggleMainPush(row)">{{ row.isMainPush ? '取消主推' : '设为主推' }}</el-button>
            <el-button link type="danger" v-if="canEdit()" @click="requestDeletePackage(row)">删除</el-button>
          </div>
        </template>
      </el-table-column>
    </el-table>
  </div>

  <el-dialog v-model="dialogVisible" :close-on-click-modal="false" :close-on-press-escape="!saving" :title="form && form.id ? '编辑旅拍套餐' : '新增旅拍套餐'" width="680px" class="package-simple-dialog" @close="closeDialog">
    <div v-if="form" class="package-simple-form">
      <div class="package-form-tip">这些字段会直接影响小程序首页、点位页、套餐详情和预约页。</div>
      <div class="package-form-grid">
        <label class="package-form-field package-form-field--wide"><span>套餐名称</span><el-input v-model="form.name" maxlength="50" show-word-limit placeholder="例如：长沙夜景双人旅拍套餐" /></label>
        <label class="package-form-field"><span>售价（元）</span><el-input-number v-model="form.price" :min="0" :step="50" controls-position="right" /></label>
        <label class="package-form-field"><span>原价（元）</span><el-input-number v-model="form.originalPrice" :min="0" :step="50" controls-position="right" /></label>
        <label class="package-form-field package-form-field--wide"><span>封面图 <el-button link @click="uploadPackageCover">上传图片</el-button></span><el-input v-model="form.cover" @change="validateMediaUrl(form,'cover')" placeholder="填写可访问的图片地址，留空使用默认占位图" /></label>
        <label class="package-form-field package-form-field--wide"><span>适用打卡点</span><el-select v-model="form.spotIds" multiple filterable placeholder="不选择表示全城通用"><el-option v-for="spot in (data.spots || []).filter(Boolean)" :key="spot.id || spot._id" :label="spot.name" :value="spot.id || spot._id" /></el-select></label>
        <label class="package-form-field"><span>拍摄风格</span><el-select v-model="form.seriesId" clearable filterable placeholder="可选"><el-option v-for="series in (data.series || []).filter(Boolean)" :key="series.id || series._id" :label="series.name" :value="series.id || series._id" /></el-select></label>
        <label class="package-form-field"><span>关联照片留影</span><el-select v-model="form.albumId" clearable filterable placeholder="可选"><el-option v-for="album in (data.albums || []).filter(Boolean)" :key="album.id || album._id" :label="album.name" :value="album.id || album._id" /></el-select></label>
        <label class="package-form-field package-form-field--wide"><span>服务内容</span><el-input v-model="form.serviceTagsText" placeholder="用顿号、逗号或换行分隔，例如：拍摄60分钟、精修12张、1套服装" /></label>
        <label class="package-form-field package-form-field--wide"><span>套餐说明</span><el-input v-model="form.description" type="textarea" :rows="3" maxlength="160" show-word-limit placeholder="小程序套餐详情页展示的说明" /></label>
      </div>
      <div class="package-form-switches">
        <el-switch v-model="form.isShow" active-text="小程序上架展示" inactive-text="暂不展示" />
        <el-switch v-model="form.isMainPush" active-text="首页主推" inactive-text="普通套餐" />
      </div>
    </div>
    <template #footer>
      <el-button :disabled="saving" @click="closeDialog">取消</el-button>
      <el-button type="primary" :loading="saving" @click="saveForm">保存</el-button>
    </template>
  </el-dialog>
</div>
