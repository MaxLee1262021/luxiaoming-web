<div class="table-card">
  <div class="table-title">
    <div>
      <strong>我的拍摄任务</strong>
      <p>摄影师须先接受本人任务，才能开始和完成拍摄；无法履约必须说明原因并退回客服重新派单。</p>
    </div>
  </div>
  <el-table :data="pagedList('tasks', taskOrders)" stripe border empty-text="暂无待办拍摄任务，有新分配的拍摄会出现在这里" @row-click="(row)=>openOrder(row,{readonly:true})">
    <el-table-column prop="orderNo" label="订单号" width="140" />
    <el-table-column prop="customer" label="客户" width="120" />
    <el-table-column prop="appointmentAt" label="预约时间" width="170" />
    <el-table-column label="商品" min-width="180">
      <template #default="{row}">{{ productName(row.products[0]) }}</template>
    </el-table-column>
    <el-table-column label="状态" width="150">
      <template #default="{row}">
        <span class="status-dot" :style="{background:orderWorkflowStatusMeta(row).color}"></span>{{ orderWorkflowStatusLabel(row) }}
        <div v-if="afterSaleBadge(row)" class="after-sale-badge">{{ afterSaleBadge(row) }}</div>
      </template>
    </el-table-column>
    <el-table-column fixed="right" label="操作" width="480">
      <template #default="{row}">
        <el-button link @click.stop="openOrder(row,{readonly:true})">查看</el-button>
        <el-tooltip content="仅本人待接受的任务可以确认接受" placement="top" :disabled="canAcceptTask(row)">
          <span class="disabled-tip-wrap">
            <el-button link type="primary" :disabled="!canAcceptTask(row)" @click.stop="acceptTask(row)">接受任务</el-button>
          </span>
        </el-tooltip>
        <el-tooltip content="仅本人已接受的任务可以开始拍摄" placement="top" :disabled="canStartTask(row)">
          <span class="disabled-tip-wrap">
            <el-button link :disabled="!canStartTask(row)" @click.stop="updateTaskStatus(row,'shooting')">开始拍摄</el-button>
          </span>
        </el-tooltip>
        <el-tooltip content="只有拍摄中的任务可以登记拍摄完成" placement="top" :disabled="canCompleteTask(row)">
          <span class="disabled-tip-wrap">
            <el-button link :disabled="!canCompleteTask(row)" @click.stop="updateTaskStatus(row,'completed')">拍摄完成</el-button>
          </span>
        </el-tooltip>
        <el-tooltip content="拍摄完成后，线下确认客户选片结果才可登记交付" placement="top" :disabled="canConfirmOfflineSelection(row)">
          <span class="disabled-tip-wrap">
            <el-button link type="warning" :disabled="!canConfirmOfflineSelection(row)" @click.stop="confirmOfflineSelection(row)">确认选片</el-button>
          </span>
        </el-tooltip>
        <el-tooltip content="线下选片确认后可登记成片交付，交付记录后才开放尾款" placement="top" :disabled="canDeliverOrder(row)">
          <span class="disabled-tip-wrap">
            <el-button v-if="canUploadDelivery(row)" link :disabled="uploadBusy" @click.stop="uploadDelivery(row)">上传成片</el-button><el-button v-if="canDeliverOrder(row)" link type="success" :disabled="uploadBusy" @click.stop="deliverOrder(row)">发布交付</el-button>
          </span>
        </el-tooltip>
        <el-tooltip content="仅本人未开拍的任务可标记无法履约，且必须说明原因" placement="top" :disabled="canRejectTask(row)">
          <span class="disabled-tip-wrap">
            <el-button link type="warning" :disabled="!canRejectTask(row)" @click.stop="rejectTask(row)">无法履约</el-button>
          </span>
        </el-tooltip>
      </template>
    </el-table-column>
  </el-table>
  <div class="table-pager" v-if="taskOrders.length > 0">
    <el-pagination background layout="total, sizes, prev, pager, next, jumper" :total="taskOrders.length" :page-sizes="[12, 20, 50, 100]" :page-size="pager('tasks').size" :current-page="pager('tasks').page" @current-change="pager('tasks').page = $event" @size-change="onListPageSizeChange('tasks', $event)" />
    <span class="pager-info">第 {{ Math.min(taskOrders.length, (pager('tasks').page-1)*pager('tasks').size+1) }}–{{ Math.min(taskOrders.length, pager('tasks').page*pager('tasks').size) }} 条 / 共 {{ taskOrders.length }} 条</span>
  </div>
</div>
