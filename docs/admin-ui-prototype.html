<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹿小鸣旅拍 · 管理后台 UI 设计稿 v3（权限边界 + 真实订单中心）</title>
<style>
  :root{
    /* 鹿小鸣品牌令牌（暖胶片国风）——后台统一皮肤 */
    --lxm-cream:#FFF7EF; --lxm-ink:#2A211B; --lxm-red:#EE2C2C; --lxm-orange:#FF8D52;
    --lxm-gold:#FFD36A; --lxm-surface:#FFFFFF; --lxm-red-ink:#CC1F1F; --lxm-muted:#766459;
    --lxm-gray-50:#FBF7F2; --lxm-gray-100:#F4ECE3; --lxm-gray-200:#E9DDD0; --lxm-gray-300:#D8C7B5;
    --lxm-gray-400:#BBA68F; --lxm-gray-650:#8A7765; --lxm-gray-900:#3A2E26;
    --lxm-brand-grad:linear-gradient(135deg,#EE2C2C 0%,#FF8D52 100%);
    --lxm-brand-soft:rgba(238,44,44,.08);
    --lxm-shadow-sm:0 1px 3px rgba(42,33,27,.06); --lxm-shadow-md:0 6px 18px rgba(42,33,27,.10);
    --lxm-radius:12px; --lxm-radius-sm:8px;
    --lxm-fz-xs:12px;--lxm-fz-sm:13px;--lxm-fz-base:14px;--lxm-fz-lg:16px;--lxm-fz-xl:20px;--lxm-fz-2xl:24px;
    --lxm-sidebar-w:248px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--lxm-gray-50);color:var(--lxm-ink);font-size:var(--lxm-fz-base);line-height:1.5;-webkit-font-smoothing:antialiased}
  /* ===== 登录屏 ===== */
  .login{position:fixed;inset:0;background:radial-gradient(120% 120% at 50% 0%,#FFF7EF 0%,#F4ECE3 60%,#E9DDD0 100%);display:flex;align-items:center;justify-content:center;z-index:100;overflow-y:auto;padding:24px}
  .login.hide{display:none}
  .login-card{width:420px;max-width:94vw;background:var(--lxm-surface);border-radius:18px;box-shadow:var(--lxm-shadow-md);padding:34px 32px 28px;text-align:center;border:1px solid var(--lxm-gray-200)}
  .login .seal{width:60px;height:60px;border-radius:16px;background:var(--lxm-brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:32px;box-shadow:var(--lxm-shadow-sm);margin:0 auto 14px}
  .login h2{font-size:var(--lxm-fz-2xl);font-weight:700}
  .login .sub{font-size:13px;color:var(--lxm-muted);margin:6px 0 22px}
  .login .field{text-align:left;margin-bottom:13px}
  .login .field label{display:block;font-size:12px;font-weight:600;color:var(--lxm-gray-650);margin-bottom:6px}
  .login .field input{width:100%;border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius-sm);padding:11px 13px;font-size:14px;font-family:inherit;background:var(--lxm-gray-50)}
  .login .field input:focus{outline:none;border-color:var(--lxm-red);background:#fff}
  .login .btn-login{width:100%;margin-top:6px;min-height:44px;background:var(--lxm-brand-grad);color:#fff;border:none;border-radius:var(--lxm-radius-sm);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--lxm-shadow-sm)}
  .login .btn-login:hover{filter:brightness(1.05)}
  .login .wx-tip{margin-top:14px;font-size:12px;color:var(--lxm-muted);display:flex;align-items:center;gap:6px;justify-content:center}
  .login .foot{margin-top:18px;font-size:11px;color:var(--lxm-gray-400)}
  .login .role-quick{margin-top:18px;border-top:1px dashed var(--lxm-gray-200);padding-top:16px;text-align:left}
  .login .role-quick .tt{font-size:12px;font-weight:600;color:var(--lxm-gray-650);margin-bottom:10px}
  .login .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .login .role-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius-sm);background:var(--lxm-gray-50);cursor:pointer;font-size:13px;font-weight:600;transition:.15s;text-align:left}
  .login .role-btn:hover{border-color:var(--lxm-red);background:var(--lxm-brand-soft)}
  .login .role-btn .d{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  /* ===== 布局骨架 ===== */
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--lxm-sidebar-w);flex:0 0 var(--lxm-sidebar-w);background:var(--lxm-surface);border-right:1px solid var(--lxm-gray-200);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--lxm-gray-100)}
  .brand .seal{width:34px;height:34px;border-radius:9px;background:var(--lxm-brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;box-shadow:var(--lxm-shadow-sm)}
  .brand .name{font-weight:700;font-size:var(--lxm-fz-lg);letter-spacing:.5px}
  .brand .sub{font-size:11px;color:var(--lxm-muted)}
  .nav{padding:8px 10px 20px;flex:1}
  .nav-group{margin-top:12px}
  .nav-group>.label{font-size:11px;color:var(--lxm-gray-400);font-weight:600;padding:0 10px 5px;letter-spacing:1px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--lxm-radius-sm);color:var(--lxm-gray-650);cursor:pointer;font-size:var(--lxm-fz-base);transition:.15s;position:relative;margin-bottom:2px;min-height:42px}
  .nav-item:hover{background:var(--lxm-gray-50);color:var(--lxm-ink)}
  .nav-item.active{background:var(--lxm-brand-soft);color:var(--lxm-red-ink);font-weight:600}
  .nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--lxm-brand-grad)}
  .nav-item .ico{width:18px;text-align:center;opacity:.85}
  .nav-item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--lxm-red)}
  .nav-item small{display:block;font-size:11px;color:var(--lxm-muted);font-weight:400;margin-top:1px}
  /* ===== 主区域 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;background:var(--lxm-surface);border-bottom:1px solid var(--lxm-gray-200);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:5}
  .topbar h1{font-size:var(--lxm-fz-xl);font-weight:700}
  .topbar .crumb{font-size:12px;color:var(--lxm-muted);margin-top:1px}
  .topbar .spacer{flex:1}
  .topbar .wx-badge{display:flex;align-items:center;gap:6px;background:#E6F7EE;color:#1a8a55;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
  .search{display:flex;align-items:center;gap:8px;background:var(--lxm-gray-50);border:1px solid var(--lxm-gray-200);border-radius:20px;padding:7px 14px;width:220px;color:var(--lxm-muted);font-size:13px}
  .bell{position:relative;font-size:18px;cursor:pointer}
  .bell .n{position:absolute;top:-4px;right:-6px;background:var(--lxm-red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;font-weight:700}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--lxm-gray-200);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--lxm-gray-650);cursor:pointer}
  .role-switch{display:flex;align-items:center;gap:6px;background:var(--lxm-gray-50);border:1px solid var(--lxm-gray-200);border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .role-switch:hover{border-color:var(--lxm-red)}
  .content{padding:22px;overflow-y:auto}
  .note{background:#FFF9E8;border:1px solid var(--lxm-gold);border-radius:var(--lxm-radius-sm);padding:11px 15px;font-size:13px;color:#7a5a12;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
  .note b{color:var(--lxm-red-ink)}
  .note.blue{background:#EAF3FF;border-color:#9CC4F5;color:#1c4f86}
  .note.blue b{color:#1c4f86}
  /* ===== 统计卡 ===== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .stat{background:var(--lxm-surface);border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius);padding:15px;box-shadow:var(--lxm-shadow-sm)}
  .stat .k{font-size:12px;color:var(--lxm-muted)}
  .stat .v{font-size:var(--lxm-fz-2xl);font-weight:700;margin-top:3px}
  .stat .v.red{color:var(--lxm-red-ink)} .stat .v.gold{color:#b8860b} .stat .v.green{color:#1a8a55}
  .stat .delta{font-size:11px;margin-top:3px;color:var(--lxm-gray-650)}
  /* ===== 工具栏 ===== */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:0 16px;min-height:40px;border-radius:var(--lxm-radius-sm);border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
  .btn-primary{background:var(--lxm-brand-grad);color:#fff;box-shadow:var(--lxm-shadow-sm)}
  .btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn-ghost{background:var(--lxm-surface);border-color:var(--lxm-gray-200);color:var(--lxm-ink)}
  .btn-ghost:hover{background:var(--lxm-gray-50)}
  .btn-danger{background:#fff;color:var(--lxm-red-ink);border-color:#F6C3B5}
  .btn-danger:hover{background:#FDE7E0}
  .btn-sm{padding:0 12px;min-height:32px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
  .input{border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius-sm);padding:9px 12px;font-size:13px;font-family:inherit;background:var(--lxm-surface);min-width:160px}
  .input:focus{outline:none;border-color:var(--lxm-red)}
  .select{border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius-sm);padding:9px 12px;font-size:13px;font-family:inherit;background:var(--lxm-surface)}
  .select:focus{outline:none;border-color:var(--lxm-red)}
  /* ===== 表格 ===== */
  .table{background:var(--lxm-surface);border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius);overflow:hidden;box-shadow:var(--lxm-shadow-sm)}
  .table table{width:100%;border-collapse:collapse}
  .table th{text-align:left;font-size:12px;color:var(--lxm-muted);font-weight:600;padding:11px 14px;background:var(--lxm-gray-50);border-bottom:1px solid var(--lxm-gray-200);white-space:nowrap}
  .table td{padding:12px 14px;border-bottom:1px solid var(--lxm-gray-100);font-size:13px;vertical-align:middle}
  .table tbody tr:last-child td{border-bottom:none}
  .table tbody tr{cursor:pointer}
  .table tbody tr:hover td{background:var(--lxm-gray-50)}
  .cover{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--lxm-gold),var(--lxm-orange));display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex:0 0 auto}
  .title-cell{font-weight:600}
  .title-cell small{display:block;color:var(--lxm-muted);font-weight:400;font-size:11px}
  .tag{display:inline-block;background:#FFF3DA;color:#9a6b08;border:1px solid #F4D79A;border-radius:20px;padding:2px 9px;font-size:11px;margin:2px 4px 2px 0}
  .tag.series{background:#FDE7E0;color:var(--lxm-red-ink);border-color:#F6C3B5}
  .tag.blue{background:#EAF3FF;color:#1c4f86;border-color:#9CC4F5}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .badge.on{background:#E6F7EE;color:#1a8a55} .badge.off{background:var(--lxm-gray-100);color:var(--lxm-gray-650)}
  .badge.warn{background:#FFF3DA;color:#9a6b08} .badge.red{background:#FDE7E0;color:var(--lxm-red-ink)}
  .badge.blue{background:#EAF3FF;color:#1c4f86}
  .mkbadge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .mk-爆款{background:#FDE7E0;color:#CC1F1F}
  .mk-主推{background:#FFE9D6;color:#D2691E}
  .mk-热门{background:#FFF3DA;color:#9a6b08}
  .grp-title{font-size:12px;font-weight:700;color:var(--lxm-c-muted,#766459);margin:14px 0 6px;letter-spacing:.5px}
  .decor-wrap{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}
  @media(max-width:1100px){.decor-wrap{grid-template-columns:1fr}}
  .phone{background:#1c1714;border-radius:28px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:290px;margin:0 auto}
  .phone-screen{background:#FFF7EF;border-radius:20px;overflow:hidden;min-height:520px}
  .phone-banner{height:118px;background:linear-gradient(135deg,#EE2C2C,#FF8D52);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
  .phone-mod{display:flex;justify-content:space-between;padding:11px 13px;border-bottom:1px solid #f0e6da;font-size:12px;color:#2A211B}
  .phone-mod .s{color:#9a8a7d}
  .banner-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--lxm-gray-200,#eee);border-radius:10px;margin-bottom:8px}
  .banner-row .thumb{width:54px;height:40px;border-radius:6px;background:linear-gradient(135deg,#EE2C2C,#FF8D52);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
  .mod-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--lxm-gray-200,#eee);border-radius:10px;margin-bottom:8px}
  .badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .switch{width:40px;height:22px;border-radius:20px;background:var(--lxm-gray-300);position:relative;cursor:pointer;transition:.2s;display:inline-block}
  .switch.on{background:linear-gradient(135deg,#EE2C2C,#FF8D52)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on::after{left:20px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .link{color:var(--lxm-red-ink);cursor:pointer;font-size:13px;font-weight:500}
  .link:hover{text-decoration:underline}
  .link.ghost{color:var(--lxm-gray-650)}
  .muted{color:var(--lxm-muted)}
  .view{display:none} .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* ===== 弹窗 / 抽屉 ===== */
  .mask{position:fixed;inset:0;background:rgba(42,33,27,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .mask.show{display:flex}
  .modal{background:var(--lxm-surface);width:600px;max-width:94vw;border-radius:16px;box-shadow:var(--lxm-shadow-md);overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--lxm-gray-100)}
  .modal header h3{font-size:var(--lxm-fz-lg);font-weight:700}
  .modal .x{cursor:pointer;color:var(--lxm-muted);font-size:20px;line-height:1}
  .modal .body{padding:18px 22px;overflow-y:auto}
  .modal footer{padding:13px 22px;border-top:1px solid var(--lxm-gray-100);display:flex;justify-content:flex-end;gap:10px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--lxm-gray-650);margin-bottom:6px}
  .field .hint{font-size:11px;color:var(--lxm-muted);margin-top:4px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius-sm);padding:9px 12px;font-size:13px;font-family:inherit;background:var(--lxm-surface)}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--lxm-red)}
  .field textarea{resize:vertical;min-height:60px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .chip-input{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius-sm);padding:7px 10px;min-height:40px}
  .chip-input input{border:none;outline:none;flex:1;min-width:80px;font-size:13px;font-family:inherit}
  .chip{background:#FFF3DA;color:#9a6b08;border-radius:20px;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
  .chip x{cursor:pointer;font-weight:700}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--lxm-gray-100)}
  .toggle-row:last-child{border-bottom:none}
  .mini-cover{width:100%;height:110px;border-radius:10px;background:linear-gradient(135deg,var(--lxm-gold),var(--lxm-orange));display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;margin-bottom:8px}
  /* ===== 照片留影编辑器（左列表·中表单·右手机预览） ===== */
  .album-editor{display:grid;grid-template-columns:270px 1fr 300px;gap:18px;align-items:start}
  @media(max-width:1180px){.album-editor{grid-template-columns:1fr}}
  .ae-list{background:var(--lxm-surface);border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius);overflow:hidden;box-shadow:var(--lxm-shadow-sm)}
  .ae-list .head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--lxm-gray-100)}
  .ae-item{display:flex;gap:10px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--lxm-gray-100);cursor:pointer}
  .ae-item:last-child{border-bottom:none}
  .ae-item:hover{background:var(--lxm-gray-50)}
  .ae-item.active{background:#FFF3DA;border-left:3px solid var(--lxm-red);padding-left:12px}
  .ae-item .ci{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,var(--lxm-gold),var(--lxm-orange));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex:none}
  .ae-item .nm{font-weight:600;font-size:13px;color:var(--lxm-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ae-item .sub{font-size:11px;color:var(--lxm-muted)}
  .ae-form{background:var(--lxm-surface);border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius);padding:18px;box-shadow:var(--lxm-shadow-sm)}
  .ae-form .ff{margin-bottom:14px}
  .ae-form .ff label{display:block;font-size:12px;font-weight:600;color:var(--lxm-gray-650);margin-bottom:6px}
  .ae-form .ff input,.ae-form .ff textarea,.ae-form .ff select{width:100%;border:1px solid var(--lxm-gray-200);border-radius:var(--lxm-radius-sm);padding:9px 12px;font-size:13px;font-family:inherit;background:var(--lxm-surface)}
  .ae-form .ff input:focus,.ae-form .ff textarea:focus,.ae-form .ff select:focus{outline:none;border-color:var(--lxm-red)}
  .ae-form .ff textarea{resize:vertical;min-height:64px}
  .ae-preview{position:sticky;top:14px}
  .pd-card{display:flex;gap:10px;padding:10px;background:#fff;border-radius:12px;margin:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .pd-cover{width:62px;height:62px;border-radius:10px;background:linear-gradient(135deg,#EE2C2C,#FF8D52);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;flex:none;position:relative}
  .pd-cover.off{filter:grayscale(1);opacity:.55}
  .pd-cover .corner{position:absolute;top:0;left:0;background:#CC1F1F;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px 0 10px 0}
  .pd-title{font-weight:700;font-size:13px;color:#2A211B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pd-price{color:#CC1F1F;font-weight:700;font-size:14px;margin-top:3px}
  .pd-offline{font-size:11px;margin-top:3px}
  .pd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 10px 10px}
  .pd-grid .pc{aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,#FFE9D6,#FFD36A);display:flex;align-items:center;justify-content:center;font-size:16px}
  .pd-seriesbar{background:#fff;margin:10px;border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .pd-notes{font-size:11px;color:#766459;line-height:1.5;padding:0 14px 14px}
  .pd-offbar{text-align:center;color:#9a8a7d;font-size:11px;padding:16px}
  /* 旅拍套餐编辑器预览补充 */

<script>
/* ===================== 角色与权限配置（对齐工程 roles.js / business-config.js） ===================== */
const ROLES = {
  super:      { name:'系统超管', role:'超管', scope:'全部数据', home:'dashboard', avatar:'鹿',
    menus:['dashboard','orders','afterSales','financeReview','reconciliation','staff','distributors','shops','miniConfig','albums','video','packages','peripherals','spots','samples','miniDecor','guides','cities','roles','logs','trash'],

    actions:['view','shootUpdate'] },
  // 商家＝线下合作方（门店）。只能看自己门店产生的数据：本门店订单/售后/结算，看不到其他门店、也看不到平台全局。

    menus:['shopSelf','orders','afterSales'],
    actions:['view','export'] },
  distributor:{ name:'分销员', role:'分销员', scope:'仅自己推广订单', home:'dashboard', avatar:'销',

};
const MENU_META = {
  dashboard:{label:'经营看板',icon:'📊',view:'dashboard',group:'经营中心'},

let CUR_ROLE = 'super';

/* ===================== 视图渲染 ===================== */
const VIEWS = {
  dashboard(){

      const ownOrders=ORDERS.filter(orderScopeFilter);

function updatePackageItem(idx,prop,val){

function renderSeriesPreview(){

  return `<div class="phone-banner">照片留影</div><div class="pd-sec" style="font-weight:700;font-size:12px;color:#2A211B;padding:10px 12px 4px">风格系列（客人端入口）</div>

function selectSeries(id){ ST_SEL=id; gotoView('series'); }
function updateSeries(prop,val){ const p=STYLES.find(x=>x.id===ST_SEL); if(!p) return; p[prop]=(prop==='order'||prop==='count')?(Number(val)||0):val; const el=document.getElementById('stPreviewInner'); if(el) el.innerHTML=renderSeriesPreview(); if(REMOTE) remoteWrite('series', p.id, {[prop]:p[prop]}); }
function toggleSeries(prop){ const p=STYLES.find(x=>x.id===ST_SEL); if(p){ p[prop]=!p[prop]; if(REMOTE) remoteWrite('series', p.id, {[prop]:p[prop]}); } selectSeries(ST_SEL); }

    foot=`<button class="btn btn-primary" onclick="alert('标记：拍摄中 / 已交付')">🎬 标记拍摄完成</button><button class="btn btn-ghost" onclick="alert('查看任务详情')">查看</button>`;
  } else {
    foot=`<button class="btn btn-ghost" onclick="alert('当前角色仅可查看/导出，无编辑权限')">查看详情</button><button class="btn btn-ghost btn-sm" onclick="alert('导出该订单')">导出</button>`;
  }
  document.getElementById('odFoot').innerHTML=foot;
  document.getElementById('orderDrawer').classList.add('show');
}

function openCreate(type){
  const s=FORM_SCHEMAS[type]; if(!s) return;
  document.getElementById('mTitle').textContent=s.title;
  let h='';
  if(s.note) h+=`<div class="note" style="margin-bottom:14px">ℹ️ <span>${s.note}</span></div>`;
  s.groups.forEach(g=>{
    if(g.fields){
      if(g.fields.length===2) h+=`<div class="twocol">`;
      g.fields.forEach(f=>{ h+=fieldHTML(f); });
      if(g.fields.length===2) h+=`</div>`;
    }
    if(g.toggles){
      if(g.title) h+=`<div class="grp-title">${g.title}</div>`;
      g.toggles.forEach(t=>{ h+=`<div class="toggle-row"><div><div style="font-weight:600;font-size:13px">${t.label}</div><div class="hint" style="margin:0">${t.hint}</div></div><span class="switch ${t.on?'on':''}" onclick="this.classList.toggle('on')"></span></div>`; });
    }
  });
  document.getElementById('mBody').innerHTML=h;
  document.getElementById('mask').classList.add('show');
}
function fieldHTML(f){
  let inner='';
  if(f.type==='combo') inner=`<input list="dl_${f.k}" placeholder="${f.ph||''}"><datalist id="dl_${f.k}">${f.options.map(o=>`<option>${o}</option>`).join('')}</datalist><div class="hint">${f.hint||''}</div>`;
  else if(f.type==='select') inner=`<select>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;
  else if(f.type==='chips') inner=`<div class="chip-input" id="chip_${f.k}"><input placeholder="输入后回车添加" onkeydown="if(event.key==='Enter'){addChip(this)}"></div>`;
  else if(f.type==='number') inner=`<input type="number" value="${f.val!==undefined?f.val:''}">`;
  else if(f.type==='upload') inner=`<div class="mini-cover" style="cursor:pointer" onclick="alert('打开图片上传（接素材库/本地）')">⬆ 上传封面</div>`;
  else if(f.type==='checks') inner=`<div style="display:flex;flex-direction:column;gap:6px">${f.options.map(o=>`<label style="font-size:13px;display:flex;gap:8px;align-items:center"><input type="checkbox"> ${o}</label>`).join('')}</div><div class="hint">${f.hint||''}</div>`;
  else inner=`<input placeholder="${f.ph||''}">`;
  return `<div class="field"><label>${f.label}</label>${inner}</div>`;
}
function closeModal(){ document.getElementById('mask').classList.remove('show'); }
function addChip(input){
  const v=input.value.trim(); if(!v) return;
  const c=document.createElement('span'); c.className='chip'; c.innerHTML=v+' <x onclick="this.parentNode.remove()">✕</x>';
  input.parentNode.insertBefore(c,input); input.value='';
}
document.getElementById('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeModal(); });

/* ===================== 登录 / 角色切换 / 侧边栏 ===================== */
function loginAs(role){
  CUR_ROLE=role;
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('app').style.display='flex';
  buildSidebar();
  gotoView(ROLES[role].home);
  document.getElementById('curRole').textContent=ROLES[role].name;
  document.getElementById('curAvatar').textContent=ROLES[role].avatar;
}
function logout(){ if(confirm('切换角色 / 退出登录？')){ document.getElementById('app').style.display='none'; document.getElementById('loginScreen').classList.remove('hide'); } }
function buildSidebar(){
  const rp=ROLES[CUR_ROLE];
  let html='';
  GROUP_ORDER.forEach(g=>{
    const items=rp.menus.map(k=>MENU_META[k]).filter(m=>m && m.group===g);
    if(!items.length) return;
    html+=`<div class="nav-group"><div class="label">${g}</div>`;
    items.forEach(m=>{ html+=`<div class="nav-item" data-view="${m.view}"><span class="ico">${m.icon}</span>${m.label}</div>`; });
    html+=`</div>`;
  });
  const nav=document.getElementById('sideNav');
  nav.innerHTML=html;
  nav.querySelectorAll('.nav-item').forEach(el=> el.addEventListener('click',()=>gotoView(el.dataset.view)));
}
function gotoView(v){
  const content=document.getElementById('content');
  const meta=Object.values(MENU_META).find(m=>m.view===v);
  if(VIEWS[v]){
    content.innerHTML=VIEWS[v]();
    document.getElementById('pageTitle').textContent=meta?meta.label:v;
    document.getElementById('pageCrumb').textContent=(meta?meta.group:'')+' / '+(meta?meta.label:'');
    // 高亮侧边栏
    document.querySelectorAll('#sideNav .nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
    // 权限提示（订单/财务等）
    if(v==='orders'||v==='finance') showPermNote(v);
  } else {
    content.innerHTML=placeholderHTML(v,'📦','该模块占位');
  }
  content.scrollTop=0;
}
function toast(msg){ const t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--lxm-ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:var(--lxm-shadow-md)'; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function showPermNote(v){
  const rp=ROLES[CUR_ROLE];
  const note=document.createElement('div'); note.className='perm-note';
  note.innerHTML=`<span>🔐 <b>权限边界</b>：当前为 <b>${rp.name}</b> 视角，数据范围「${rp.scope}」${v==='orders'?'——上表订单与可见操作已按此过滤':''}。点右上角「切换角色」可对比其他角色看到的界面。</span>`;
  document.getElementById('content').insertBefore(note, document.getElementById('content').firstChild);
}
